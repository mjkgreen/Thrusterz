name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Physics, levels and mission proofs
        run: npm test
      - name: Install headless Chromium
        run: npm ci && npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser checks (Chromium)
        run: npm run test:browser
      - name: Install WebKit (Safari's engine)
        run: npx playwright install --with-deps webkit
      - name: Browser checks (WebKit), including replay matching Node exactly
        run: BROWSER=webkit npm run test:browser
